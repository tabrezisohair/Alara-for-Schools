<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#102a56" />
    <title>Alara</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #102a56;
        color: #f4f6fb;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        letter-spacing: 0.18em;
        font-size: 0.85rem;
        color: #e8b923;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.45;
        color: rgba(244, 246, 251, 0.78);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>ALARA</h1>
      <p>
        Opening your school workspace. If this screen stays, start the Alara
        server or set CAPACITOR_SERVER_URL to your live site.
      </p>
    </div>
  </body>
</html>
